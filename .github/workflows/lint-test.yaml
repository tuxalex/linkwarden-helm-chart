name: Lint and Test Charts

on: pull_request

permissions: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint --config .ct-config.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.12.0

      - name: Deploy cnpg operator (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm install cnpg --namespace cnpg-system --create-namespace --wait-for-jobs --wait=watcher cnpg/cloudnative-pg
          kubectl get pods --namespace cnpg-system

      - name: Deploy envoy-gateway CRD (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm template eg oci://docker.io/envoyproxy/gateway-crds-helm \
          --version v0.0.0-latest \
          --set crds.gatewayAPI.enabled=true \
          --set crds.gatewayAPI.channel=standard \
          --set crds.envoyGateway.enabled=true \
          | kubectl apply --server-side -f -

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install --config .ct-config.yaml --target-branch ${{ github.event.repository.default_branch }}
