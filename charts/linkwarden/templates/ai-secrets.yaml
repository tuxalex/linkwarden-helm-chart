
{{- if and (include "linkwarden.aiEnabled" .) (not .Values.linkwarden.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkwarden.fullname" . }}-ai
  labels:
    {{- include "linkwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $provider, $config := .Values.linkwarden.ai.providers }}
    {{- if not $config.enabled }}
      {{- continue }}
    {{- end }}
    {{- $providerUpper := upper $provider }}
    {{ printf "%s_API_KEY" ($providerUpper) }}: {{ $config.apiKey | quote }}
    {{ printf "%s_MODEL" ($providerUpper) }}: {{ $config.model | quote }}
    {{- range $key, $value := $config.secrets }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- end }}
